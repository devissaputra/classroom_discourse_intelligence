<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Synthetic classroom-discourse metrics</title>
<desc id="desc">Synthetic demonstration values for teacher-talk share, open-question rate, feedback rate, learner-elaboration rate, and uptake rate.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Synthetic classroom-discourse metrics</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Bundled synthetic transcript · descriptive output only</text>
<g font-family="Arial">
<rect x="45" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="225" font-size="17" fill="#475569">Teacher talk share</text><text x="70" y="315" font-size="50" font-weight="700" fill="#0f172a">0.508</text>
<rect x="275" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="300" y="225" font-size="17" fill="#475569">Open-question rate</text><text x="300" y="315" font-size="50" font-weight="700" fill="#0f172a">0.682</text>
<rect x="505" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="530" y="225" font-size="17" fill="#475569">Feedback rate</text><text x="530" y="315" font-size="50" font-weight="700" fill="#0f172a">0.233</text>
<rect x="735" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="760" y="225" font-size="17" fill="#475569">Learner elaboration</text><text x="760" y="315" font-size="50" font-weight="700" fill="#0f172a">0.305</text>
<rect x="965" y="180" width="190" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="990" y="225" font-size="17" fill="#475569">Uptake rate</text><text x="990" y="315" font-size="50" font-weight="700" fill="#0f172a">0.108</text>
</g>
<rect x="135" y="470" width="930" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Synthetic descriptive demonstration</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The values do not establish temporal effects, causal links, or teaching quality.</text>
</svg>