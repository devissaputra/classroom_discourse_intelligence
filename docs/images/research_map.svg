<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460"><rect width="1200" height="460" fill="#fafafa"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700">Research Map</text><g font-family="Arial" font-size="21"><text x="70" y="145">Construct: human-annotated teacher discursive moves</text><text x="70" y="200">Data: authentic K-12 mathematics transcripts</text><text x="70" y="255">Generalization unit: unseen transcript</text><text x="70" y="310">Baseline claim: predictive classification only</text><text x="70" y="365">Excluded claim: teaching quality, causal impact, teacher ranking</text></g></svg>