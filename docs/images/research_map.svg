<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Classroom Discourse Intelligence research map</title><desc id="desc">Implemented research map for pedagogical move frequencies, open-question rate, feedback, learner elaboration, and uptake rates.</desc>
<rect width="1200" height="675" fill="#f8fafc"/><text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Classroom Discourse · implemented research map</text>
<g font-family="Arial">
<rect x="60" y="145" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="185" font-size="21" font-weight="700" fill="#2563eb">RQ1</text><text x="90" y="225" font-size="19" fill="#334155">Which pedagogical moves appear most often?</text>
<rect x="640" y="145" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="670" y="185" font-size="21" font-weight="700" fill="#166534">Evidence</text><text x="670" y="225" font-size="19" fill="#334155">Transparent rule-based move labels</text>
<rect x="60" y="300" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="340" font-size="21" font-weight="700" fill="#0e7490">RQ2</text><text x="90" y="380" font-size="19" fill="#334155">What share of questions invite explanation?</text>
<rect x="640" y="300" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="670" y="340" font-size="21" font-weight="700" fill="#166534">Evidence</text><text x="670" y="380" font-size="19" fill="#334155">Open-question rate among tagged questions</text>
<rect x="60" y="455" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="495" font-size="21" font-weight="700" fill="#7e22ce">RQ3</text><text x="90" y="535" font-size="19" fill="#334155">How frequent are feedback, elaboration, and uptake moves?</text>
<rect x="640" y="455" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="670" y="495" font-size="21" font-weight="700" fill="#166534">Evidence</text><text x="670" y="530" font-size="19" fill="#334155">Independent feedback, elaboration, and uptake rates</text><text x="670" y="557" font-size="17" fill="#64748b">No claim that one move causes the next.</text>
</g></svg>