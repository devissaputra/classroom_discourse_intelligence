<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460"><rect width="1200" height="460" fill="#fafafa"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700">Empirical Pipeline</text><g font-family="Arial" font-size="21"><text x="70" y="150">1. Download TalkMoves</text><text x="70" y="205">2. Parse Excel transcript + human Teacher Tag</text><text x="70" y="260">3. Split entire transcript groups</text><text x="70" y="315">4. Fit training majority + TF-IDF logistic model</text><text x="70" y="370">5. Evaluate untouched transcripts with macro-F1 and per-class errors</text></g></svg>